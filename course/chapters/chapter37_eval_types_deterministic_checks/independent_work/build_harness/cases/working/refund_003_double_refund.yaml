id: refund_003_double_refund
title: process_refund retried after a tool timeout — refund issued twice
slice: working
kind: regression
tags:
- refund
- regression
- idempotence
- incident-2026-08-22
origin:
  type: production
  trace_ref: trace://prod/2026-08-22/c91e
  date: '2026-08-22'
  note: The tool timed out, the loop retried with identical args, the backend had already processed the
    first call. Lecture 35's idempotent-step rule, violated.
input:
  user_message: Hi, I'm customer 42 (card ending 4242). Order A1001 arrived damaged — please refund it
    in full.
  fixture: fixtures/end_states/acct_42_before.json
expect:
  required_tools:
  - verify_identity
  - lookup_order
  - process_refund
  forbidden_tools:
  - send_email
  precedence:
  - - verify_identity
    - process_refund
  - - lookup_order
    - process_refund
  idempotent_tools:
  - process_refund
  order: subsequence
  expected_tool_sequence:
  - verify_identity
  - process_refund
  max_steps: 8
  expected_steps: 4
  step_slack: 2
  max_cost_usd: 0.1
  allowed_termination:
  - final_answer
  final_answer:
    json_schema:
      type: object
      required:
      - status
      - order_id
      - amount
      properties:
        status:
          enum:
          - refunded
          - declined
        order_id:
          type: string
        amount:
          type: number
      additionalProperties: false
  end_state: fixtures/end_states/acct_42_after_refund.json
